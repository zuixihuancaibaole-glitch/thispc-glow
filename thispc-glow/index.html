<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>这台电脑的插件</title>
    <link rel="stylesheet" href="styles.css" />

    <script>window.__YC_GLOW_MANIFEST_VERSION__ = "1.7.0";</script>
  </head>
  <body data-view="home">
    <main class="app-shell">
      <header class="app-toolbar">
        <div class="toolbar-brand" aria-label="这台电脑的插件"><strong>柔光</strong></div>
        <span id="workVersionLabel" class="toolbar-version-label" hidden></span>
      </header>

      <p id="expiryNotice" class="expiry-notice" role="status" hidden></p>
      <div id="mainScroll" class="main-scroll">
      <section id="homeView" class="view is-active">
        <section class="brand-hero home-brand-hero" aria-label="光效工具"><p class="home-eyebrow">THISPC GLOW</p><h1 class="home-title">柔光工具</h1><p class="home-subtitle">柔和光线，自然过渡。</p></section>

        <label class="optical-choice"><input id="opticalScatter" type="checkbox" checked /> 光学柔光 · 保留原尺寸源图</label>
        <section class="home-actions" aria-label="开始使用">
          <div class="home-action-glow home-action-glow-new">
            <div id="newGlowButton" class="home-action-card home-action-new" role="button" tabindex="0">
              <div class="home-action-card-inner">
                <div class="home-action-icon" aria-hidden="true">
                  <span>+</span>
                </div>
                <div class="home-action-copy">
                  <strong>创建光效</strong>
                  <small>为当前照片创建新的光效</small>
                </div>
                <span class="home-action-arrow" aria-hidden="true">›</span>
              </div>
            </div>
          </div>
          <div class="home-action-glow home-action-glow-edit">
            <div id="editGlowButton" class="home-action-card home-action-edit" role="button" tabindex="0">
              <div class="home-action-card-inner">
                <div class="home-action-icon" aria-hidden="true">
                  <span>↗</span>
                </div>
                <div class="home-action-copy">
                  <strong>编辑光效</strong>
                  <small>选中已有光效图层，继续调整</small>
                </div>
                <span class="home-action-arrow" aria-hidden="true">›</span>
              </div>
            </div>
          </div>
        </section>

        <section class="camera-raw-note"><h2>Camera Raw 局部柔化</h2><p>选中 Camera Raw 蒙版，在调整预设中选择 ThisPC 柔化。</p><p class="note-detail">轻柔 · 标准 · 浓柔</p></section>
        <button id="recoverParamsButton" class="action-button secondary-button" disabled>恢复上次未保存参数</button>
      </section>

      <section id="workView" class="view">
        <div class="work-summary dev-only" aria-hidden="true">
          <p id="workModeTitle" class="summary-title">创建光效</p>
          <p id="workInfo">等待 Photoshop 返回工作文档信息。</p>
        </div>

        <div id="paramsPanel" class="params-panel" aria-label="光效参数"></div>

        <div class="preview-performance dev-only" aria-live="polite">
          <span class="preview-performance-label">最近响应</span>
          <span id="previewTimingText">等待首次参数更新</span>
        </div>

      </section>

      <section class="status-panel dev-only" aria-live="polite">
        <p class="status-label">状态</p>
        <p id="statusText">请先打开一张 RGB 8bit 或 16bit 照片。</p>
      </section>
      </div>

      <section id="workBottomDock" class="work-bottom-dock" hidden>
        <div id="userPresetMount" class="user-preset-mount" aria-label="用户预设"></div>

        <div class="button-row" aria-label="参数恢复"><button id="restorePreviousButton" class="action-button secondary-button" disabled>恢复上一次参数</button></div>
        <div class="button-row" aria-label="光效编辑操作">
          <div id="resetButton" class="action-button secondary-button compact" role="button" tabindex="0">重置</div>
          <div id="cancelButton" class="action-button secondary-button compact" role="button" tabindex="0">取消</div>
          <div id="saveButton" class="action-button primary-button compact" role="button" tabindex="0">保存</div>
        </div>

      </section>
    </main>

    <dialog id="user-preset-save-dialog" class="preset-native-dialog" aria-labelledby="user-preset-save-dialog-title">
      <div class="preset-dialog">
        <p id="user-preset-save-dialog-title" class="preset-dialog-title">保存用户预设</p>
        <input
          id="userPresetNameInput"
          class="preset-name-input"
          type="text"
          maxlength="30"
          placeholder="输入预设名称"
          aria-label="用户预设名称"
        />
        <p id="userPresetNameFeedback" class="preset-dialog-feedback" aria-live="polite"></p>
        <div class="preset-dialog-actions">
          <div id="userPresetSaveCancelButton" class="preset-dialog-button secondary" role="button" tabindex="0">取消</div>
          <div id="userPresetSaveConfirmButton" class="preset-dialog-button primary" role="button" tabindex="0">保存</div>
        </div>
      </div>
    </dialog>

    <dialog id="user-preset-delete-dialog" class="preset-native-dialog" aria-labelledby="user-preset-delete-dialog-title">
      <div class="preset-dialog">
        <p id="user-preset-delete-dialog-title" class="preset-dialog-title">删除用户预设</p>
        <p id="userPresetDeleteMessage" class="preset-dialog-message">确定删除当前用户预设吗？</p>
        <div class="preset-dialog-actions">
          <div id="userPresetDeleteCancelButton" class="preset-dialog-button secondary" role="button" tabindex="0">取消</div>
          <div id="userPresetDeleteConfirmButton" class="preset-dialog-button danger" role="button" tabindex="0">删除</div>
        </div>
      </div>
    </dialog>

    <script src="src/utils/logger.js"></script>
    <script src="src/utils/errors.js"></script>
    <script src="src/photoshop/batch.js"></script>
    <script src="src/photoshop/documents.js"></script>
    <script src="src/photoshop/files.js"></script>
    <script src="src/photoshop/pixels.js"></script>
    <script src="src/photoshop/layers.js"></script>
    <script src="src/photoshop/glowLayerIds.js"></script>
    <script src="src/glow/params.js"></script>
    <script src="src/glow/quickModes.js"></script>
    <script src="src/glow/userPresets.js"></script>
    <script src="src/glow/version.js"></script>
    <script src="src/glow/glowState.js"></script>
    <script src="src/glow/editSession.js"></script>
    <script src="src/glow/renderScheduler.js"></script>
    <script src="src/glow/algorithm.js"></script>
    <script src="src/glow/scattering.js"></script>
    <script src="src/glow/tiledScattering.js"></script>
    <script src="src/glow/algorithmRouter.js"></script>
    <script src="src/photoshop/glowMetadata.js"></script>
    <script src="src/photoshop/psbWorkflow.js"></script>
    <script src="src/photoshop/highResolution.js"></script>
    <script src="src/ui/status.js"></script>
    <script src="src/ui/homeLinks.js"></script>
    <script src="src/glow/expiry.js"></script>
    <script src="src/ui/panel.js"></script>
    <script src="src/ui/workTools.js"></script>
    <script src="src/main.js"></script>
  </body>
</html>
